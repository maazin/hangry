services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hangry
      POSTGRES_PASSWORD: hangry
      POSTGRES_DB: hangry
    ports:
      # 5433 on the host so this never fights a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - hangry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangry -d hangry"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  hangry_pgdata:
